[package]
name = "textviewer"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.28"
egui = "0.28"
egui_extras = "0.28"
memmap2 = "0.9"
csv-core = "0.1"
encoding_rs = "0.8"
rfd = "0.14"
rayon = "1"
memchr = "2"
# Windows 기본 힙(RtlAllocateHeap)이 이 앱 비용의 큰 몫이다 — 15.4M행 파일에서
# 전체 바꾸기 시간의 61%가 할당자였다(측정). main.rs의 #[global_allocator] 참조.
mimalloc = "0.1"

[profile.release]
opt-level = 3
lto = true
